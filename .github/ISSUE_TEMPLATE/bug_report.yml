name: Bug report
description: Report a defect in WorkflowCore
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected app/package
      placeholder: e.g. apps/execution-worker, packages/workflow-definition
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Commit / branch
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any credential values before pasting.
      render: shell
    validations:
      required: false
